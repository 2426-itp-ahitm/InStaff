# ---------------------------------------------------------------------------
# InStaff — full stack for Raspberry Pi 5 (arm64 / aarch64), behind Cloudflare.
#
# Everything is BUILT LOCALLY on the Pi (do NOT use the pfarrhoferphilip/* images
# from Docker Hub — those are amd64-only). All base images are arm64-native.
#
# Cloudflare tunnels expected:
#   api.philip-pfarrhofer.at   -> localhost:8080   (backend)
#   philip-pfarrhofer.at       -> localhost:4200   (frontend)
#   auth.philip-pfarrhofer.at  -> localhost:8081   (keycloak)   <-- add this one
#
# Run from the repo root:
#   docker compose -f docker-compose.pi.yml up -d --build
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: instaff-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres:/var/lib/postgresql/data   # persistent — survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    build: ./docker/keycloak
    container_name: instaff-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Public URL Keycloak advertises in issuer/redirects (v2 hostname).
      KC_HOSTNAME: https://auth.philip-pfarrhofer.at
      # Trust X-Forwarded-* from the Cloudflare tunnel so Keycloak knows it's HTTPS.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Enable /health endpoints (served on the management port 9000) for the healthcheck below.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak:/opt/keycloak/data       # persist users/realm across restarts
    # Report "healthy" only once Keycloak is actually ready (realm imported, HTTP up).
    # The image has no curl/wget, so we probe /health/ready via bash's /dev/tcp on the
    # management port 9000. We call bash explicitly (kc.sh needs it, so it's present).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # arm64-native mail catcher (drop-in for MailHog). SMTP 1025, UI 8025.
  mailhog:
    image: axllent/mailpit:latest
    container_name: instaff-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  backend:
    build: ./backend-new
    container_name: instaff-app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy   # wait until Keycloak is fully ready, not just started
    environment:
      QUARKUS_PROFILE: prod                # activates the %prod.* config
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: instaff-frontend
    ports:
      - "4200:80"                          # nginx :80 -> host :4200
    restart: unless-stopped

volumes:
  postgres:
  keycloak:
