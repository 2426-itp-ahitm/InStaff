<div class="relative z-10" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="modal-bg" aria-hidden="true"></div>
  <div class="modal-card-1">
    <div class="modal-card-2">
      <div class="modal-card-3">
        <div class="modal-card-4">
          <div *ngIf="shift">
            <h3 class="text-lg font-semibold text-gray-900 mb-1">{{ shift.shiftName }}</h3>
            <p class="text-sm text-gray-600 mb-3">
              {{ shift.startTime.toString() }} bis {{ shift.endTime.toString() }}
            </p>

            <div class="space-y-0 max-h-96 overflow-y-auto overflow-x-hidden pr-2 border-b border-gray-300 pb-3">
              <div *ngFor="let group of groupedAssignments" class="pb-4">
                @if (groupedAssignments.length == 0) {
                  <p class="text-sm text-gray-500">Keine Mitarbeiter zugeordnet.</p>
                }@else {
                <h4 class="font-semibold text-base mb-2">{{ group.roleName }}</h4>

                <div class="space-y-2">
                  <div
                    *ngFor="let a of group.assignments"
                    class="flex items-center gap-2 bg-white p-2 rounded-md border border-gray-200">
                    <span class="text-sm text-gray-900 flex-1">
                      {{a.employee.firstname}} {{ a.employee.lastname }}
                    </span>

                    <span
                      class="text-xs px-2 py-1 rounded min-w-24 text-center"
                      [ngClass]="{
                        'bg-green-100 text-green-800': a.confirmed === true,
                        'bg-yellow-100 text-yellow-800': a.confirmed === null,
                        'bg-red-100 text-red-800': a.confirmed === false
                      }">
                      {{ makeStringFromBoolean(a.confirmed) }}
                    </span>
                  </div>
                </div>

                }

              </div>
            </div>
          </div>

          <div class="mt-6 flex items-center justify-end gap-x-4">
            <button type="button" class="button-cancel" (click)="closeViewShift()">Schliessen</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
