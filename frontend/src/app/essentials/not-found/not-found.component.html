<main class="min-h-screen bg-[#f8f8f5] px-6 py-24 sm:py-32 lg:px-8 relative overflow-hidden">
  <div class="absolute inset-x-0 bottom-0 h-28 bg-[#d8d7cd] rounded-t-[50%] blur-sm opacity-70"></div>

  <div class="mx-auto max-w-3xl text-center relative z-10">
    <div class="inline-flex items-center rounded-full bg-[#d8d7cd]/80 px-4 py-1.5 text-sm font-medium text-[#2d3a2f] shadow-sm">
      InStaff – Seite nicht gefunden
    </div>

    <p class="mt-10 text-base font-semibold text-[#4f7d52]">404</p>

    <h1 class="mt-4 text-5xl font-semibold tracking-tight text-balance text-[#111827] sm:text-7xl">
      Diese Seite wurde nicht gefunden
    </h1>

    <p class="mx-auto mt-6 max-w-xl text-lg font-medium text-pretty text-gray-600 sm:text-xl/8">
      Die angeforderte Seite existiert nicht.
    </p>

    <div class="mt-10 flex items-center justify-center gap-x-6">
      <button type="button" (click)="goBack()" class="rounded-lg bg-[#4f7d52] px-5 py-3 text-sm font-semibold text-white shadow-md transition-all hover:scale-105 hover:bg-[#416946] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4f7d52]">
        Zurück
      </button>
    </div>
  </div>
</main>
