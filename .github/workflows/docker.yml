name: Build and Push Images
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/instaff-server/**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: instaff-frontend
            context: ./frontend
          - name: instaff-backend
            context: ./backend/instaff-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Add QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # Add Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          # Add this line - builds for both AMD64 and ARM64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/2426-itp-ahitm/${{ matrix.name }}:latest
            ghcr.io/2426-itp-ahitm/${{ matrix.name }}:${{ github.sha }}