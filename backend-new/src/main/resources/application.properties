quarkus.http.root-path=/api
quarkus.package.jar.type=uber-jar

quarkus.http.host = 0.0.0.0

quarkus.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/demo
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/demo

quarkus.hibernate-orm.database.generation=drop-and-create
# drop-and-create is required: it re-runs db/import.sql on each boot, which seeds the
# employees that EmployeeKeycloakSync then creates in Keycloak. With "update", import.sql
# does NOT run, so no employees are seeded and no Keycloak users get created.
%prod.quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation.halt-on-error=false
quarkus.hibernate-orm.sql-load-script=db/import.sql
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.log.sql=true
quarkus.http.access-log.enabled=true


quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,https://philip-pfarrhofer.at
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-setup-session
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-allow-credentials=false

# Keycloak Admin API — backend reaches Keycloak over the internal Docker network,
# NOT via the public Cloudflare URL. Server-to-server only; the JWT filter validates
# the token signature (not the issuer), so the internal URL is safe and avoids
# depending on the tunnel at startup (EmployeeKeycloakSync runs on StartupEvent).
%prod.keycloak.url=http://keycloak:8080
# Must match the "backend" client secret in docker/keycloak/realm-export.json (imported on first start)
%prod.keycloak.admin.client-secret=backend-secret-instaff

keycloak.url=http://localhost:8081
#keycloak.url=https://it210157.cloud.htl-leonding.ac.at/auth
keycloak.admin.client-secret=backend-secret-instaff

keycloak.realm=instaff
keycloak.admin.client-id=backend

# MailService
quarkus.mailer.host=localhost
%prod.quarkus.mailer.host=mailhog
quarkus.mailer.port=1025
quarkus.mailer.mock=false
quarkus.mailer.from=instaff@local.test
